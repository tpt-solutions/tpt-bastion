# SPDX-License-Identifier: Apache-2.0 OR MIT
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bastion"
version = "0.1.0"
description = "Python bindings for TPT Bastion — author infrastructure in Python and drive the bastion CLI"
readme = "README.md"
license = { text = "Apache-2.0 OR MIT" }
requires-python = ">=3.9"
keywords = ["iac", "infrastructure", "terraform", "bastion", "devops"]
authors = [{ name = "TPT", email = "oss@tpt.dev" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://bastion.tpt.dev"
Repository = "https://github.com/tpt/bastion"

[tool.hatch.build.targets.wheel]
packages = ["bastion"]
