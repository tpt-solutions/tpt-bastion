name: Publish PyPI

# Publishes the Python bindings to PyPI on a `bindings-python-v*.*.*` tag.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored in the repo.
# Configure a trusted publisher in the PyPI project `bastion`:
#   Owner/name: tpt/bastion (or your fork)
#   Workflow:    .github/workflows/publish-pypi.yml
#   Environment: release

on:
  push:
    tags:
      - "bindings-python-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v), e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build
        shell: bash

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#bindings-python-v}"
          python - <<'PY'
          import re, sys, pathlib
          p = pathlib.Path("pyproject.toml")
          t = p.read_text()
          t = re.sub(r'(?m)^version = .*', f'version = "{sys.argv[1]}"', t, count=1)
          p.write_text(t)
          PY "$VERSION"
        shell: bash

      - name: Sync version from input
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import re, sys, pathlib
          p = pathlib.Path("pyproject.toml")
          t = p.read_text()
          t = re.sub(r'(?m)^version = .*', f'version = "{sys.argv[1]}"', t, count=1)
          p.write_text(t)
          PY "${{ github.event.inputs.version }}"
        shell: bash

      - name: Include license files in the sdist
        run: cp ../../LICENSE-APACHE ../../LICENSE-MIT .
        shell: bash

      - name: Build distributions
        run: python -m build
        shell: bash

      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist
