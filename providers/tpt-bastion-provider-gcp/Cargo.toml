[package]
name = "tpt-bastion-provider-gcp"
description = "Google Cloud provider (core resource coverage) for TPT Bastion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["iac", "gcp", "terraform", "provider", "infrastructure"]
categories = ["development-tools", "api-bindings"]
documentation = "https://docs.rs/tpt-bastion-provider-gcp"
readme = "README.md"

[dependencies]
tpt-bastion-ir = { path = "../../crates/tpt-bastion-ir", version = "0.1.0" }
tpt-bastion-engine = { path = "../../crates/tpt-bastion-engine", version = "0.1.0" }
tpt-bastion-providers = { path = "../../crates/tpt-bastion-providers", version = "0.1.0" }
serde = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
cargo-arg = "--all-features"
