[package]
name = "tpt-bastion-provider-terraform-shim"
description = "Terraform/OpenTofu-compatible provider shim for TPT Bastion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["iac", "terraform", "tofu", "shim", "provider"]
categories = ["development-tools", "api-bindings"]
documentation = "https://docs.rs/tpt-bastion-provider-terraform-shim"
readme = "README.md"

[dependencies]
tpt-bastion-ir = { path = "../../crates/tpt-bastion-ir" }
tpt-bastion-engine = { path = "../../crates/tpt-bastion-engine" }
tpt-bastion-providers = { path = "../../crates/tpt-bastion-providers" }
serde = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
cargo-arg = "--all-features"
