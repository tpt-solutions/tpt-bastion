[package]
name = "bastion-provider-azure"
description = "Azure provider (core resource coverage) for TPT Bastion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/bastion-provider-azure"
keywords = ["iac", "azure", "terraform", "bastion", "provider"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
bastion-ir = { path = "../../crates/bastion-ir" }
bastion-engine = { path = "../../crates/bastion-engine" }
bastion-providers = { path = "../../crates/bastion-providers" }
serde = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
cargo-arg = "--all-features"
