# SPDX-License-Identifier: Apache-2.0 OR MIT

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tpt/bastion"
homepage = "https://bastion.tpt.dev"
authors = ["TPT <oss@tpt.dev>"]
keywords = ["iac", "infrastructure", "terraform", "devops", "rust"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
