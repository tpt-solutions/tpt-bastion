# SPDX-License-Identifier: Apache-2.0 OR MIT

[workspace]
resolver = "2"
members = ["crates/*", "providers/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tpt/bastion"
homepage = "https://bastion.tpt.dev"
authors = ["TPT <oss@tpt.dev>"]
keywords = ["iac", "infrastructure", "terraform", "devops", "rust"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
