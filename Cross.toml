# Cross-compilation configuration for `cross` (used by .github/workflows/release.yml).
# The musl target produces a fully static Linux binary with no glibc dependency.

[target.x86_64-unknown-linux-musl]
# Use the rust-musl-builder image so OpenSSL/argon2 link cleanly against musl.
image = "rust-musl-builder:latest"

[target.aarch64-unknown-linux-gnu]
# QEMU user emulation lets the aarch64 build run tests if needed.
pre-build = ["dpkg --add-architecture arm64 && apt-get update && apt-get install --assume-yes libssl-dev:arm64"]
