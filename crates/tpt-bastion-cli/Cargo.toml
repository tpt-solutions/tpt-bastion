[package]
name = "tpt-bastion-cli"
description = "Command-line interface for the TPT Bastion Infrastructure-as-Code platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["iac", "terraform", "cli", "infrastructure", "devops"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/tpt-bastion-cli"
readme = "README.md"

[[bin]]
name = "bastion"
path = "src/main.rs"

[dependencies]
tpt-bastion-dsl = { path = "../tpt-bastion-dsl" }
tpt-bastion-ir = { path = "../tpt-bastion-ir" }
tpt-bastion-engine = { path = "../tpt-bastion-engine" }
tpt-bastion-state = { path = "../tpt-bastion-state" }
tpt-bastion-providers = { path = "../tpt-bastion-providers" }
tpt-bastion-events = { path = "../tpt-bastion-events" }
tpt-bastion-ui = { path = "../tpt-bastion-ui" }
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
