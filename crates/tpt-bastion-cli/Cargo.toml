# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "tpt-bastion-cli"
description = "Command-line interface for the TPT Bastion Infrastructure-as-Code platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["iac", "terraform", "cli", "infrastructure", "devops"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/tpt-bastion-cli"
readme = "README.md"

[[bin]]
name = "bastion"
path = "src/main.rs"

[dependencies]
tpt-bastion-dsl = { path = "../tpt-bastion-dsl", version = "0.1.0" }
tpt-bastion-ir = { path = "../tpt-bastion-ir", version = "0.1.0" }
tpt-bastion-engine = { path = "../tpt-bastion-engine", version = "0.1.0" }
tpt-bastion-state = { path = "../tpt-bastion-state", version = "0.1.0" }
tpt-bastion-providers = { path = "../tpt-bastion-providers", version = "0.1.0" }
tpt-bastion-events = { path = "../tpt-bastion-events", version = "0.1.0" }
tpt-bastion-ui = { path = "../tpt-bastion-ui", version = "0.1.0" }
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap_complete = "4.6"
