[package]
name = "tpt-bastion-ir"
description = "Intermediate representation (IR) for the TPT Bastion Infrastructure-as-Code platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["iac", "ir", "serialization", "infrastructure", "terraform"]
categories = ["development-tools", "data-structures"]
documentation = "https://docs.rs/tpt-bastion-ir"
readme = "README.md"

[dependencies]
serde.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
