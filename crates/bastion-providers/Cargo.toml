[package]
name = "bastion-providers"
description = "Provider plugin system (SDK, schema, runtime, registry) for TPT Bastion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/bastion-providers"
keywords = ["iac", "infrastructure", "provider", "plugin", "terraform"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
bastion-ir = { path = "../bastion-ir" }
bastion-engine = { path = "../bastion-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
cargo-arg = "--all-features"
