[package]
name = "tpt-bastion-engine"
description = "Dependency graph, planning, and execution core for TPT Bastion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["iac", "terraform", "planning", "dependency-graph", "infrastructure"]
categories = ["development-tools", "algorithms"]
documentation = "https://docs.rs/tpt-bastion-engine"
readme = "README.md"

[dependencies]
tpt-bastion-ir = { path = "../tpt-bastion-ir", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
cargo-arg = "--all-features"
