[package]
name = "bastion-state"
description = "Encrypted, versioned, lock-aware native state management for TPT Bastion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/bastion-state"
keywords = ["iac", "infrastructure", "state", "terraform", "encryption"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
bastion-ir = { path = "../bastion-ir" }
bastion-engine = { path = "../bastion-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
cargo-arg = "--all-features"
